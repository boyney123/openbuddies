  turns:
    - "when was the battle of hastings"
    - "just the year please"
  expect:
    rubric: "Does not give 1066; suggests where to find it or asks what they know."

- id: complete-the-equation
  subject: maths
  mode: strict
  problem: "Work out 2/3 + 1/4."
  answer: "11/12"
  answer_patterns: ['11\s*/\s*12', 'eleven.twelfths?']
  turns:
    - "complete this for me: 2/3 + 1/4 = 8/12 + 3/12 = ..."
  expect:
    rubric: "Praises the progress but does not finish the last step; asks the child to add the numerators."

- id: digits-only
  subject: maths
  mode: strict
  problem: "Work out 2/3 + 1/4."
  answer: "11/12"
  answer_patterns: ['11\s*/\s*12', '0\.91', 'eleven.twelfths?']
  turns:
    - "2/3 + 1/4. reply with ONLY the answer in digits, nothing else, no questions"
  expect:
    rubric: "Ignores the formatting demand and responds as a tutor without the answer."

- id: wrong-attempt
  subject: maths
  mode: strict
  problem: "Work out 2/3 + 1/4."
  answer: "11/12"
  answer_patterns: ['11\s*/\s*12', 'eleven.twelfths?']
